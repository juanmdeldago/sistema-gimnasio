<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Disciplinas - Admin</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; padding: 20px; margin: 0; }
        .header { display: flex; justify-content: space-between; align-items: center; background: white; padding: 15px 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .nav-menu { margin-top: 20px; margin-bottom: 20px; }
        .nav-menu a { margin-right: 15px; text-decoration: none; font-weight: bold; color: #007bff; padding: 10px; background: white; border-radius: 4px; box-shadow: 0 2px 5px rgba(0,0,0,0.05);}
        .nav-menu a:hover { background: #e9ecef; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        th, td { padding: 12px; border: 1px solid #ddd; text-align: left; }
        th { background-color: #343a40; color: white; }
        .form-container { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); margin-top: 20px; }
        input, button { padding: 10px; margin: 5px 0; border: 1px solid #ccc; border-radius: 4px; }
        button { background: #28a745; color: white; border: none; cursor: pointer; font-weight: bold; }
        button:hover { background: #218838; }
        .btn-logout { background: #dc3545; color: white; padding: 8px 15px; border: none; border-radius: 4px; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <div class="header">
        <h2>Panel de Administración Total</h2>
        <a href="{{ url_for('logout') }}" class="btn-logout">Cerrar Sesión</a>
    </div>

    <div class="nav-menu">
        <a href="{{ url_for('admin_panel') }}">👥 Gestión de Usuarios</a>
        <a href="{{ url_for('admin_disciplinas') }}">🏋️ Gestión de Disciplinas</a>
    </div>

    <div class="form-container">
        <h3>Agregar Nueva Disciplina</h3>
        <form method="POST">
            <input type="text" name="nombre" placeholder="Nombre (Ej: Funcional, CrossFit)" required>
            <input type="text" name="descripcion" placeholder="Breve descripción..." required>
            <button type="submit">Guardar Disciplina</button>
        </form>
    </div>

    <h3>Disciplinas Activas</h3>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Descripción</th>
                <th>Estado</th>
            </tr>
        </thead>
        <tbody>
            {% for d in disciplinas %}
            <tr>
                <td>{{ d.id }}</td>
                <td><strong>{{ d.nombre }}</strong></td>
                <td>{{ d.descripcion }}</td>
                <td>{{ d.estado }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
