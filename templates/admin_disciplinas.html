<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Disciplinas - Admin</title>
    <style>
        :root {
            --bg-main: #0f172a;
            --bg-sidebar: #1e293b;
            --bg-card: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --border: #334155;
            --danger: #ef4444;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); display: flex; min-height: 100vh; }
        
        /* BARRA LATERAL */
        .sidebar { width: 260px; background-color: var(--bg-sidebar); border-right: 1px solid var(--border); display: flex; flex-direction: column; position: fixed; height: 100vh; }
        .sidebar-header { padding: 30px 25px; border-bottom: 1px solid var(--border); text-align: center; }
        .sidebar-header h2 { color: var(--accent); font-size: 22px; font-weight: 800; letter-spacing: 1px; }
        .sidebar-menu { list-style: none; padding-top: 20px; flex-grow: 1; }
        .sidebar-menu a { display: flex; align-items: center; padding: 16px 25px; color: var(--text-muted); text-decoration: none; font-weight: 500; transition: all 0.2s; border-left: 4px solid transparent; }
        .sidebar-menu a:hover { background-color: rgba(56, 189, 248, 0.05); color: var(--text-main); }
        .sidebar-menu a.active { background-color: rgba(56, 189, 248, 0.1); color: var(--accent); border-left: 4px solid var(--accent); }
        .sidebar-menu a span { margin-right: 15px; font-size: 20px; width: 25px; text-align: center; }
        .sidebar-footer { padding: 25px; border-top: 1px solid var(--border); }
        .btn-logout { display: block; text-align: center; background-color: rgba(239, 68, 68, 0.1); color: var(--danger); text-decoration: none; padding: 12px; border-radius: 8px; font-weight: bold; transition: 0.2s; border: 1px solid rgba(239, 68, 68, 0.2); }
        .btn-logout:hover { background-color: var(--danger); color: white; }

        /* ÁREA PRINCIPAL */
        .main-content { margin-left: 260px; flex-grow: 1; padding: 40px; width: calc(100% - 260px); }
        .top-header { margin-bottom: 30px; }
        .top-header h1 { font-size: 26px; font-weight: 600; margin-bottom: 5px; }
        .top-header p { color: var(--text-muted); }
        
        .card { background-color: var(--bg-card); border-radius: 12px; padding: 25px; border: 1px solid var(--border); box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); margin-bottom: 25px; }
        
        /* FORMULARIO */
        .form-group { display: flex; gap: 15px; margin-bottom: 15px; }
        input { flex: 1; padding: 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg-main); color: white; font-size: 14px; }
        button { background: var(--accent); color: var(--bg-main); border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 14px; }
        button:hover { background: #0ea5e9; }

        /* TABLA */
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 15px 15px 15px 0; color: var(--text-muted); font-size: 13px; text-transform: uppercase; border-bottom: 1px solid var(--border); }
        td { padding: 16px 15px 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
        tr:last-child td { border-bottom: none; }
        .badge-active { background-color: rgba(34, 197, 94, 0.15); color: #22c55e; padding: 5px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; }
    </style>
</head>
<body>
    
    <aside class="sidebar">
        <div class="sidebar-header">
            <h2>CROSSADMIN</h2>
        </div>
        <ul class="sidebar-menu">
            <li><a href="{{ url_for('admin_panel') }}"><span>👥</span> Usuarios</a></li>
            <li><a href="{{ url_for('admin_disciplinas') }}" class="active"><span>🏋️</span> Disciplinas</a></li>
            <li><a href="{{ url_for('admin_clases') }}"><span>📅</span> Agenda</a></li>
        </ul>
        <div class="sidebar-footer">
            <a href="{{ url_for('logout') }}" class="btn-logout">Cerrar Sesión</a>
        </div>
    </aside>

    <main class="main-content">
        <div class="top-header">
            <h1>Disciplinas</h1>
            <p>Gestioná las actividades disponibles en el gimnasio</p>
        </div>
        
        <div class="card">
            <h3 style="margin-bottom: 20px; font-size: 16px;">Agregar Nueva Actividad</h3>
            <form method="POST">
                <div class="form-group">
                    <input type="text" name="nombre" placeholder="Nombre (Ej: CrossFit, Funcional)" required>
                    <input type="text" name="descripcion" placeholder="Breve descripción" required>
                    <button type="submit">+ Guardar</button>
                </div>
            </form>
        </div>

        <div class="card">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Descripción</th>
                        <th>Estado</th>
                    </tr>
                </thead>
                <tbody>
                    {% for d in disciplinas %}
                    <tr>
                        <td style="color: var(--text-muted);">#{{ d.id }}</td>
                        <td style="font-weight: bold; color: var(--accent);">{{ d.nombre }}</td>
                        <td>{{ d.descripcion }}</td>
                        <td><span class="badge-active">{{ d.estado }}</span></td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </main>

</body>
</html>
