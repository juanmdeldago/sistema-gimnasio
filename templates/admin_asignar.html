<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Asignar Plan</title>
    <style>
        :root { --bg-main: #0f172a; --bg-card: #1e293b; --text-main: #f8fafc; --accent: #38bdf8; --border: #334155; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg-main); color: var(--text-main); display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: var(--bg-card); padding: 30px; border-radius: 12px; border: 1px solid var(--border); width: 400px; }
        label { display: block; margin: 15px 0 5px 0; color: #94a3b8; font-size: 13px; }
        select, input { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg-main); color: white; }
        button { width: 100%; background: var(--accent); color: var(--bg-main); border: none; padding: 12px; border-radius: 6px; font-weight: bold; margin-top: 20px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="card">
        <h3>Asignar Plan a {{ usuario.nombre }} {{ usuario.apellido }}</h3>
        <form method="POST">
            <label>Disciplina Autorizada</label>
            <select name="disciplina_id" required>
                {% for d in disciplinas %}
                    <option value="{{ d.id }}">{{ d.nombre }}</option>
                {% endfor %}
            </select>
            <label>Vigencia del Plan (en días)</label>
            <select name="dias" required>
                <option value="30">30 Días (Mensual)</option>
                <option value="90">90 Días (Trimestral)</option>
                <option value="365">365 Días (Anual)</option>
            </select>
            <button type="submit">Guardar Asignación</button>
            <a href="{{ url_for('admin_panel') }}" style="display:block; text-align:center; color:#ef4444; margin-top:15px; text-decoration:none; font-size:14px;">Cancelar</a>
        </form>
    </div>
</body>
</html>
