<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro de Alumno</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0f172a; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; color: white;}
        .card { background: #1e293b; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); width: 320px; }
        input { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #334155; border-radius: 4px; box-sizing: border-box; background: #0f172a; color: white;}
        button { width: 100%; background: #38bdf8; color: #0f172a; border: none; padding: 10px; border-radius: 4px; cursor: pointer; font-weight: bold; margin-top: 10px;}
        .link { text-align: center; margin-top: 15px; font-size: 14px; }
        .link a { color: #38bdf8; text-decoration: none; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Crear Cuenta</h2>
        {% with messages = get_flashed_messages() %}{% if messages %}<div style="color:red; font-size:13px;">{{ messages[0] }}</div>{% endif %}{% endwith %}
        <form method="POST">
            <input type="text" name="nombre" placeholder="Nombre" required>
            <input type="text" name="apellido" placeholder="Apellido" required>
            <input type="email" name="email" placeholder="Correo Electrónico" required>
            <input type="text" name="telefono" placeholder="Teléfono" required>
            <input type="text" name="username" placeholder="Elegí un Usuario" required>
            <input type="password" name="password" placeholder="Contraseña" required>
            <button type="submit">Registrarse</button>
        </form>
        <div class="link">¿Ya tenés cuenta? <a href="{{ url_for('login') }}">Iniciá sesión</a></div>
    </div>
</body>
</html>
